[workspace]
resolver = "3"
members = [
    "crates/lumina-core",
    "crates/lumina-app",
    "crates/lumina-testdll",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Lumina"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
